<svg viewBox="0 0 1000 162" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round-corners-gaza"><rect width="1000" height="162" rx="3" /></clipPath>
  </defs>

  <g clip-path="url(#round-corners-gaza)">
    <rect x="0" y="0" width="1000" height="54" fill="#000000"/>
    <rect x="0" y="54" width="1000" height="54" fill="#ffffff"/>
    <rect x="0" y="108" width="1000" height="54" fill="#007a3d"/>
    <polygon points="0,0 116,81 0,162" fill="#ce1126"/>
  </g>

  <text fill="#000000" font-size="19"
        font-family="Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
    <tspan x="140" y="79">Over 66,000 civilians, including more than 18,400 children, have been killed in Gaza.</tspan>
    <tspan x="140" y="102">It&#39;s a genocide (per the UN Commission of Inquiry). Please help Palestinians survive and rebuild.</tspan>
  </text>

  <text x="50%" y="136" dominant-baseline="middle" text-anchor="middle"
        fill="#ffffff" font-size="23"
        font-family="Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
    Help Gaza Now <tspan dominant-baseline="middle" font-size="15">&#10148;</tspan>
  </text>
</svg>
